<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FUT Champions W/L Overlay</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
  body{font-family:Arial,Helvetica,sans-serif}
  .wrap{
    width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;
    background:transparent;
  }
  .score{
    --gold:#ffd84a; --gold2:#ff9d00; --red:#ff3355; --green:#39ff88;
    position:relative; width:min(920px,94vw); height:178px;
    display:grid; grid-template-columns:1fr 1.5fr 1fr; align-items:center;
    filter:drop-shadow(0 12px 28px rgba(0,0,0,.65));
  }
  .score:before{
    content:""; position:absolute; inset:10px 0;
    background:
      linear-gradient(135deg,rgba(255,216,74,.13),transparent 28%),
      linear-gradient(315deg,rgba(255,51,85,.10),transparent 32%),
      #090a0d;
    clip-path:polygon(3% 0,97% 0,100% 18%,100% 82%,97% 100%,3% 100%,0 82%,0 18%);
    border:1px solid rgba(255,216,74,.45);
  }
  .score:after{
    content:"";position:absolute;inset:10px 0;pointer-events:none;
    background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(255,255,255,.025) 10px 12px);
    clip-path:polygon(3% 0,97% 0,100% 18%,100% 82%,97% 100%,3% 100%,0 82%,0 18%);
  }
  .side,.center{position:relative;z-index:2}
  .side{height:112px;display:flex;align-items:center;justify-content:center;gap:12px}
  .left{padding-left:35px}.right{padding-right:35px}
  .icon{
    width:64px;height:64px;display:grid;place-items:center;
    clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);
    font-weight:1000;font-size:26px;color:#090a0d;
  }
  .left .icon{background:linear-gradient(145deg,#b9ffcf,var(--green))}
  .right .icon{background:linear-gradient(145deg,#ff9aab,var(--red))}
  .num{font-size:64px;line-height:.9;font-weight:1000;letter-spacing:-4px}
  .left .num{color:#f2fff6;text-shadow:0 0 18px rgba(57,255,136,.32)}
  .right .num{color:#fff1f3;text-shadow:0 0 18px rgba(255,51,85,.3)}
  .label{font-size:13px;font-weight:900;letter-spacing:3px;margin-top:7px;opacity:.72}
  .left .label{color:var(--green)} .right .label{color:#ff8095}
  .center{text-align:center;align-self:center}
  .brand{
    display:inline-flex;align-items:center;gap:8px;
    color:#08090b;font-weight:1000;letter-spacing:2.2px;
    padding:8px 17px 7px;background:linear-gradient(90deg,#ffe56f,#ffad00);
    clip-path:polygon(7% 0,93% 0,100% 50%,93% 100%,7% 100%,0 50%);
    box-shadow:0 0 25px rgba(255,181,0,.25);
    font-size:16px;
  }
  .crown{font-size:17px}
  .title{color:#fff;font-size:31px;font-weight:1000;letter-spacing:4px;margin-top:10px;text-shadow:0 2px 0 #000}
  .sub{color:#aeb4bf;font-size:10px;font-weight:800;letter-spacing:3px;margin-top:5px}
  .streak{
    margin:10px auto 0;width:190px;height:4px;
    background:linear-gradient(90deg,transparent,#ffd84a,#ff9d00,#ffd84a,transparent);
    box-shadow:0 0 12px rgba(255,196,43,.7)
  }
  .bolt{position:absolute;z-index:3;color:#ffd84a;font-size:18px}
  .b1{left:1%;top:23%}.b2{right:1%;bottom:23%}
  .corner{position:absolute;z-index:3;font-size:9px;letter-spacing:2px;color:#777f8c;font-weight:900}
  .c1{left:31px;top:24px}.c2{right:31px;bottom:24px}
  @media(max-width:700px){
    .score{height:140px}.side{height:90px}.icon{width:45px;height:45px;font-size:19px}
    .num{font-size:44px}.title{font-size:21px}.brand{font-size:11px}.sub{font-size:7px}
    .left{padding-left:15px}.right{padding-right:15px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="score">
    <div class="corner c1">FUT CHAMPIONS</div>
    <div class="corner c2">EA SPORTS • LIVE</div>
    <div class="bolt b1">✦</div><div class="bolt b2">✦</div>

    <div class="side left">
      <div class="icon">W</div>
      <div>
        <div class="num" id="wins">12</div>
        <div class="label">WINS</div>
      </div>
    </div>

    <div class="center">
      <div class="brand"><span class="crown">♛</span> CHAMPIONS</div>
      <div class="title">WEEKEND LEAGUE</div>
      <div class="sub">MATCH RECORD</div>
      <div class="streak"></div>
    </div>

    <div class="side right">
      <div>
        <div class="num" id="losses">4</div>
        <div class="label">LOSSES</div>
      </div>
      <div class="icon">L</div>
    </div>
  </div>
</div>
<script>
  const p=new URLSearchParams(location.search);
  document.getElementById('wins').textContent=p.get('wins') ?? '12';
  document.getElementById('losses').textContent=p.get('losses') ?? '4';
</script>
</body>
</html>
